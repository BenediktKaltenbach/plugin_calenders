name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript prüfen
        run: |
          for f in assets/*.js blocks/*/index.js; do node --check "$f"; done
          if grep -nE '\(\?<[=!]' assets/*.js blocks/*/index.js; then
            echo "::error::Regex-Lookbehind gefunden – bricht in Safari vor 16.4 das ganze Skript ab."
            exit 1
          fi
      - name: Abhängigkeiten installieren
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Tests
        run: php tests/run.php
